[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "rear-warning"
version = "0.1.0"
description = "Smart rear-collision warning system"
requires-python = ">=3.11"
dependencies = [
    "pyserial>=3.5,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
hardware = [
    "gpiozero>=2.0.1.post3,<3",
    "lgpio>=0.2.2,<1",
    "smbus2>=0.6.1,<1",
]

[project.scripts]
tfmini-plus-diagnostic = "rear_warning.cli.tfmini_plus_diagnostic:main"
led-diagnostic = "rear_warning.cli.led_diagnostic:main"
rear-warning-diagnostic = "rear_warning.cli.rear_warning_diagnostic:main"
bno055-diagnostic = "rear_warning.cli.bno055_diagnostic:main"
sensor-sync-diagnostic = "rear_warning.cli.sensor_sync_diagnostic:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
pythonpath = ["src"]
testpaths = ["tests"]
