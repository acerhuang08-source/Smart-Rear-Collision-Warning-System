[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "rear-warning"
version = "0.1.0"
description = "Smart rear-collision warning system"
requires-python = ">=3.11"
dependencies = ["pyserial>=3.5,<4"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
tfmini-plus-diagnostic = "rear_warning.cli.tfmini_plus_diagnostic:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
pythonpath = ["src"]
testpaths = ["tests"]
